<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video App</title>
    <link rel="stylesheet" href="style.css?v=8000">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0b0f19 !important;
            color: #ffffff;
        }
        #welcome-screen { display: block; }
        #main-app-screen { display: none; }
        #video-output-screen { display: none; }
        
        /* مساحة الباند العلوية المحجوزة لإعلان Start.io لكي لا يغطي على التصميم */
        .ad-header-wrapper {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 0;
            background: transparent;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- 1. واجهة الترحيب -->
    <div id="welcome-screen" class="screen">
        <div class="welcome-container">
            <div class="clapperboard-icon">
                <div class="clapper-top"></div>
                <div class="clapper-bottom">
                    <span>DIRECTOR</span>
                    <span>CAMERA</span>
                    <span>DATE</span>
                </div>
            </div>
            <h1 class="welcome-title">ai video w</h1>
            <p class="welcome-subtitle">Create TikToks & Reels in Seconds</p>
            <button id="start-btn" class="start-btn" onclick="document.getElementById('welcome-screen').style.display='none'; document.getElementById('main-app-screen').style.display='block'; showTopBanner();">Start Creating 🚀</button>
        </div>
    </div>

    <!-- 2. الواجهة الرئيسية (صفحة الإعدادات والميديا) -->
    <div id="main-app-screen" class="screen">
        <!-- هذه المساحة الفارغة سيملؤها إعلان Start.io العلوي -->
        <div class="ad-header-wrapper"></div>
        
        <div class="app-card">
            <h1 class="main-title">ai video w</h1>
            <p class="sub-header">Ultimate AI Video Generator</p>

            <div class="input-group">
                <label>Center Main Text:</label>
                <input type="text" id="main-c" placeholder="Fhjkkbbvcv">
            </div>

            <div class="row">
                <div class="input-group half">
                    <label>Top-Left Text:</label>
                    <input type="text" id="top-left-text" placeholder="Ttuijvcy">
                </div>
                <div class="input-group half">
                    <label>Top-Right Text:</label>
                    <input type="text" id="top-right-text" placeholder="Jjhggh">
                </div>
            </div>

            <div class="row">
                <div class="input-group half">
                    <label>Text Size:</label>
                    <input type="range" id="text-size" min="20" max="100" value="50">
                    <span class="slider-value">Dynamic Scale</span>
                </div>
                <div class="input-group half">
                    <label>Transition Delay:</label>
                    <input type="range" id="durationPerImg" min="1" max="10" value="3">
                    <span class="slider-value">3s / Image</span>
                </div>
            </div>

            <div class="checkbox-grid">
                <label class="checkbox-container"><input type="checkbox" id="neon-glow" checked><span class="checkmark"></span> Neon Glow Typing</label>
                <label class="checkbox-container"><input type="checkbox" id="ken-burns" checked><span class="checkmark"></span> Cinematic Ken-Burns</label>
                <label class="checkbox-container"><input type="checkbox" id="blurred-bg" checked><span class="checkmark"></span> Smart Blurred BG</label>
                <label class="checkbox-container"><input type="checkbox" id="dust-overlay" checked><span class="checkmark"></span> Dust Particles Overlay</label>
                <label class="checkbox-container"><input type="checkbox" id="audio-waves" checked><span class="checkmark"></span> Audio Sound Waves</label>
                <label class="checkbox-container"><input type="checkbox" id="cross-fade" checked><span class="checkmark"></span> Cross-Fade Effect</label>
                <label class="checkbox-container"><input type="checkbox" id="glitch-filter" checked><span class="checkmark"></span> 3D Glitch Filter</label>
                <label class="checkbox-container"><input type="checkbox" id="bounce-anim" checked><span class="checkmark"></span> Bounce Text Animation</label>
            </div>

            <div class="color-picker-row">
                <div class="color-picker-item"><input type="color" id="text-color-picker" value="#ffffff"><label for="text-color-picker">Text</label></div>
                <div class="color-picker-item"><input type="color" id="neon-color-picker" value="#ff007f"><label for="neon-color-picker">Neon Glow</label></div>
            </div>

            <div class="row button-row" style="display: flex; gap: 10px; justify-content: center;">
                <button type="button" class="upload-btn" onclick="document.getElementById('image-input').click();">Upload Images 📸</button>
                <button type="button" class="upload-btn" onclick="document.getElementById('music-input').click();">Upload Music 🎵</button>
                <input type="file" id="image-input" multiple accept="image/*" style="display: none;">
                <input type="file" id="music-input" accept="audio/*" style="display: none;">
            </div>

            <p id="file-status" class="file-status">No files selected yet</p>
            <button id="generate-btn" class="generate-btn">Generate & Compile Masterpiece ⚡</button>
        </div>
    </div>

    <!-- 3. شاشة عرض النتيجة -->
    <div id="video-output-screen" class="screen">
        <div class="app-card video-card">
            <div class="video-preview-wrapper">
                <canvas id="videoCanvas" style="display: none;"></canvas>
                <video id="outputVideo" autoplay controls playsinline loop></video>
            </div>
            <div class="action-buttons-row">
                <a id="download-btn" class="app-btn download-btn" style="display: none;">Download Video 📥</a>
                <button id="back-btn" class="app-btn back-btn">Back ↩️</button>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="script.js?v=8000"></script>

    <script type="text/javascript">
        function showTopBanner() {
            if (typeof AndroidAds !== 'undefined') { 
                AndroidAds.showTopBanner(); 
            }
        }
    </script>
</body>
</html>
