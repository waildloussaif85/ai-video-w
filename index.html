<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. واجهة الترحيب -->
    <div id="welcome-screen" class="screen active">
        <div class="welcome-container">
            <div class="clapperboard-icon">
                <div class="clapper-top"></div>
                <div class="clapper-bottom">
                    <span>DIRECTOR</span>
                    <span>CAMERA</span>
                    <span>DATE</span>
                </div>
            </div>
            <h1 class="welcome-title">ai video w</h1>
            <p class="welcome-subtitle">Create TikToks & Reels in Seconds</p>
            <button id="start-btn" class="start-btn">Start Creating 🚀</button>
        </div>
    </div>

    <!-- 2. الواجهة الرئيسية للتطبيق -->
    <div id="main-app-screen" class="screen">
        <div class="app-card">
            <h1 class="main-title">ai video w</h1>
            <p class="sub-header">Ultimate AI Video Generator</p>

            <div class="input-group">
                <label>Center Main Text:</label>
                <input type="text" id="main-caption" placeholder="Main video caption here...">
            </div>

            <div class="row">
                <div class="input-group half-width">
                    <label>Top-Left Text:</label>
                    <input type="text" id="top-left-text" placeholder="Poiu">
                </div>
                <div class="input-group half-width">
                    <label>Top-Right Text:</label>
                    <input type="text" id="top-right-text" placeholder="1234">
                </div>
            </div>

            <div class="row">
                <div class="input-group half-width">
                    <label>Text Size:</label>
                    <input type="range" id="text-size-slider" min="10" max="100" value="30">
                    <span class="slider-value">Dynamic Scale</span>
                </div>
                <div class="input-group half-width">
                    <label>Transition Delay:</label>
                    <input type="range" id="transition-slider" min="1" max="10" value="5">
                    <span class="slider-value">5s / Image</span>
                </div>
            </div>

            <div class="checkbox-grid">
                <label class="checkbox-container">
                    <input type="checkbox" id="neon-glow-typing">
                    <span class="checkmark">Neon Glow Typing</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="cinematic-ken-burns">
                    <span class="checkmark">Cinematic Ken-Burns</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="smart-blurred-bg">
                    <span class="checkmark">Smart Blurred BG</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="dust-particles">
                    <span class="checkmark">Dust Particles Overlay</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="audio-waves">
                    <span class="checkmark">Audio Sound Waves</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="cross-fade">
                    <span class="checkmark">Cross-Fade Effect</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="glitch-filter">
                    <span class="checkmark">3D Glitch Filter</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="bounce-animation">
                    <span class="checkmark">Bounce Text Animation</span>
                </label>
            </div>

            <div class="color-picker-row">
                <div class="color-picker-item">
                    <input type="color" id="text-color-picker" value="#ffffff">
                    <label for="text-color-picker">Text</label>
                </div>
                <div class="color-picker-item">
                    <input type="color" id="neon-color-picker" value="#ff007f">
                    <label for="neon-color-picker">Neon Glow</label>
                </div>
            </div>

            <div class="row button-row">
                <button class="upload-btn" id="upload-images-trigger">Upload Images 📸</button>
                <button class="upload-btn" id="upload-music-trigger">Upload Music 🎵</button>
                <input type="file" id="image-input" multiple accept="image/*" style="display:none;">
                <input type="file" id="music-input" accept="audio/*" style="display:none;">
            </div>

            <p id="file-status" class="file-status-text">No files selected yet</p>
            <button id="generate-btn" class="generate-btn">Generate & Compile Masterpiece ⚡</button>
        </div>
    </div>

    <!-- 3. شاشة النتيجة النهائية وعرض الفيديو -->
    <div id="video-output-screen" class="screen">
        <div class="app-card video-card">
            <div class="video-preview-wrapper">
                <canvas id="videoCanvas" width="1080" height="1920" style="display: none;"></canvas>
                <video id="outputVideo" autoplay controls playsinline></video>
            </div>
            <div class="action-buttons-row">
                <a id="download-btn" class="action-btn download-btn-style">Save Video 📥</a>
                <button id="back-btn" class="action-btn back-btn-style">Create Another 🔄</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
