name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. تهيئة بيئة Node.js بإصدار متوافق حديث لتخطي تحذير السيرفر
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 2. تحديث مكتبة الجافا إلى v5 المتوافقة كلياً مع Ubuntu الحديثة
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت أدوات أندرويد الأساسية (Android SDK) لبناء تطبيق حقيقي شغّال
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create and Build Project
      run: |
        cordova create cordova_project com.waildloussa.aivideow "AI Video W"
        cd cordova_project
        rm -rf www/*
        cp ../index.html www/
        cp ../script.js www/
        cp ../style.css www/
        
        # نسخ ملف config.xml المصلح الخاص بك من المستودع
        cp ../config.xml .
        
        cordova platform add android
        # البناء العادي لتفادي مشاكل توقيع النسخ على السيرفر وضمان خروج ملف الـ APK فوراً
        cordova build android

    # 4. توليد الإصدار ورفع الـ APK لبناء الرابط العام المباشر للجميع دون تسجيل دخول
    - name: Create Tag and Release Build
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: AI Video W v1.0.${{ github.run_number }}
        files: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
