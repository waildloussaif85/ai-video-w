name: Build Cordova APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Framework & Move Files
      run: |
        cordova create myApp com.wail.aivideo AIVideo
        cd myApp
        cordova platform add android
        rm -rf www/*
        cp -r ../index.html ../style.css ../app.js ./www/
        cordova plugin add cordova-plugin-startapp-ads --save
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: my-app-apk
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

