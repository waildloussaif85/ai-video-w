name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create and Build Project
      run: |
        cordova create cordova_project com.waildloussa.aivideow "AI Video W"
        cd cordova_project
        rm -rf www/*
        cp ../index.html www/
        cp ../script.js www/
        cp ../style.css www/
        cp ../config.xml .
        cordova platform add android
        
        # 1. إضافة مستودع Start.io الرسمي في إعدادات Gradle الحديثة
        sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/://startapp.com" }/g' platforms/android/settings.gradle || true
        sed -i 's/mavenCentral()/mavenCentral()\n        maven { url "https:\/\/://startapp.com" }/g' platforms/android/build.gradle || true

        # 2. إضافة مكتبات Unity Ads و Start.io الرسمية
        sed -i '/dependencies {/a \    implementation "com.unity3d.ads:unity-ads:4.12.0"\n    implementation "com.startapp:inapp-sdk:5.0.2"' platforms/android/app/build.gradle

        # 3. كتابة كود الجافا لربط أرقامك الحقيقية بواجهة التطبيق
        cat << 'EOF' > platforms/android/app/src/main/java/com/waildloussa/aivideow/MainActivity.java
        package com.waildloussa.aivideow;

        import android.os.Bundle;
        import android.view.View;
        import android.view.ViewGroup;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebView;
        import android.widget.RelativeLayout;
        import org.apache.cordova.*;
        import com.startapp.sdk.ads.banner.Banner;
        import com.startapp.sdk.adsbase.StartAppAd;
        import com.startapp.sdk.adsbase.StartAppSDK;
        import com.unity3d.ads.IUnityAdsInitializationListener;
        import com.unity3d.ads.IUnityAdsLoadListener;
        import com.unity3d.ads.IUnityAdsShowListener;
        import com.unity3d.ads.UnityAds;
        import com.unity3d.ads.UnityAdsShowOptions;

        public class MainActivity extends CordovaActivity {
            private Banner startAppBanner;
            private RelativeLayout bannerContainer;

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // تهيئة Start.io برقمك الحقيقي
                StartAppSDK.init(this, "210770048", false);
                StartAppAd.disableSplash();

                // تهيئة Unity Ads برقمك الحقيقي
                UnityAds.initialize(getApplicationContext(), "800430370", false, new IUnityAdsInitializationListener() {
                    @Override
                    public void onInitializationComplete() {
                        UnityAds.load("fd6faa46-ba0e-46b8-b3db-a7f456ee0b01", new IUnityAdsLoadListener() {
                            @Override public void onUnityAdsAdLoaded(String placementId) {}
                            @Override public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {}
                        });
                    }
                    @Override public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {}
                });

                loadUrl(launchUrl);

                WebView webView = (WebView) appView.getEngine().getView();
                webView.getSettings().setJavaScriptEnabled(true);
                webView.addJavascriptInterface(new AdBridge(), "AndroidAds");
            }

            public class AdBridge {
                @JavascriptInterface
                public void showTopBanner() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            if (bannerContainer == null) {
                                bannerContainer = new RelativeLayout(MainActivity.this);
                                RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(
                                    ViewGroup.LayoutParams.WRAP_CONTENT,
                                    ViewGroup.LayoutParams.WRAP_CONTENT
                                );
                                params.addRule(RelativeLayout.ALIGN_PARENT_TOP);
                                params.addRule(RelativeLayout.CENTER_HORIZONTAL);
                                startAppBanner = new Banner(MainActivity.this);
                                bannerContainer.addView(startAppBanner, params);
                                addContentView(bannerContainer, new ViewGroup.LayoutParams(
                                    ViewGroup.LayoutParams.MATCH_PARENT,
                                    ViewGroup.LayoutParams.WRAP_CONTENT
                                ));
                            }
                            bannerContainer.setVisibility(View.VISIBLE);
                        }
                    });
                }

                @JavascriptInterface
                public void hideTopBanner() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            if (bannerContainer != null) {
                                bannerContainer.setVisibility(View.GONE);
                            }
                        }
                    });
                }

                @JavascriptInterface
                public void showUnityAd() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            UnityAds.show(MainActivity.this, "fd6faa46-ba0e-46b8-b3db-a7f456ee0b01", new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                @Override public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                    triggerSaveInWeb();
                                }
                                @Override public void onUnityAdsShowStart(String placementId) {}
                                @Override public void onUnityAdsShowClick(String placementId) {}
                                @Override public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                    UnityAds.load("fd6faa46-ba0e-46b8-b3db-a7f456ee0b01", new IUnityAdsLoadListener() {
                                        @Override public void onUnityAdsAdLoaded(String id) {}
                                        @Override public void onUnityAdsFailedToLoad(String id, UnityAds.UnityAdsLoadError err, String msg) {}
                                    });
                                    triggerSaveInWeb();
                                }
                            });
                        }
                    });
                }

                private void triggerSaveInWeb() {
                    final WebView webView = (WebView) appView.getEngine().getView();
                    webView.post(new Runnable() {
                        @Override
                        public void run() {
                            webView.evaluateJavascript("window.executeVideoSave();", null);
                        }
                    });
                }
            }
        }
        EOF

        cordova build android

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: AI Video W v1.0.${{ github.run_number }}
        files: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
