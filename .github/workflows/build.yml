name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build
        run: |
          cordova create build-dir com.walid.aivideow "ai video w"
          cd build-dir
          cordova platform add android@11.0.0 --nobackup
          rm -rf www/*
          cp -r ../* www/ || true
          cordova plugin add cordova-plugin-admob-plus --variable ADMOB_APP_ID_ANDROID="ca-app-pub-3620129121552586~4258571441"
          cordova plugin add cordova-plugin-unityads
          cordova build android --release --device --no-telemetry
