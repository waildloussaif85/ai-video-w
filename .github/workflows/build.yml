name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova_project com.waildloussaif.aivideow "AIVideoW"
        cd cordova_project
        rm -rf www/*
        cp ../index.html www/
        cp ../style.css www/
        cp ../script.js www/
        cp ../app-ads.txt www/
        cp ../config.xml .
        cordova platform add android
        cordova build android --release --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-application-apk
        path: cordova_project/platforms/android/app/build/outputs/apk/release/*.apk
