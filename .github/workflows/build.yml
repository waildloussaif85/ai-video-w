name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create and Build Project
      run: |
        cordova create cordova_project com.waildloussa.aivideow "AI Video W"
        cd cordova_project
        rm -rf www/*
        cp ../index.html www/
        cp ../script.js www/
        cp ../style.css www/
        cp ../config.xml .
        cordova platform add android
        
        cat << 'EOF' > platforms/android/app/build-extras.gradle
        repositories {
            mavenCentral()
            google()
            maven { url 'https://startapp.com' }
        }
        dependencies {
            implementation 'com.unity3d.ads:unity-ads:4.12.0'
            implementation 'com.startapp:inapp-sdk:5.0.2'
        }
        EOF

        cat << 'EOF' > platforms/android/app/src/main/java/com/waildloussa/aivideow/MainActivity.java
        package com.waildloussa.aivideow;

        import android.os.Bundle;
        import android.os.Environment;
        import android.util.Base64;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebView;
        import android.widget.FrameLayout;
        import android.widget.Toast;
        import java.io.File;
        import java.io.FileOutputStream;
        import org.apache.cordova.*;
        import com.startapp.sdk.ads.banner.Banner;
        import com.startapp.sdk.adsbase.StartAppAd;
        import com.startapp.sdk.adsbase.StartAppSDK;
        import com.unity3d.ads.IUnityAdsInitializationListener;
        import com.unity3d.ads.IUnityAdsLoadListener;
        import com.unity3d.ads.IUnityAdsShowListener;
        import com.unity3d.ads.UnityAds;
        import com.unity3d.ads.UnityAdsShowOptions;

        public class MainActivity extends CordovaActivity {
            private Banner startAppBanner;
            private FrameLayout bannerContainer;
            private String activeUnityPlacement = "Rewarded_Android";
            private boolean isUnityReady = false;

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // 1. تفعيل الإعلانات الحقيقية في Start.io
                StartAppSDK.init(this, "210770048", false);
                StartAppAd.disableSplash();

                // 2. تهيئة Unity Ads (ضع false لتشغيل الإعلانات الحقيقية بعد التأكد من ظهورها)
                UnityAds.initialize(getApplicationContext(), "800430370", true, new IUnityAdsInitializationListener() {
                    @Override
                    public void onInitializationComplete() {
                        loadUnityAd("Rewarded_Android");
                    }
                    @Override
                    public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "Unity Error: " + message, Toast.LENGTH_LONG).show());
                    }
                });

                loadUrl(launchUrl);

                if (appView != null && appView.getEngine() != null) {
                    WebView webView = (WebView) appView.getEngine().getView();
                    webView.getSettings().setJavaScriptEnabled(true);
                    webView.addJavascriptInterface(new AdBridge(), "AndroidAds");
                }
            }

            private void loadUnityAd(final String placement) {
                UnityAds.load(placement, new IUnityAdsLoadListener() {
                    @Override
                    public void onUnityAdsAdLoaded(String placementId) {
                        activeUnityPlacement = placementId;
                        isUnityReady = true;
                    }
                    @Override
                    public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                        // إذا فشل الاسم الأول، يجرب النظام الاسم البديل تلقائياً
                        if (placement.equals("Rewarded_Android")) {
                            loadUnityAd("Interstitial_Android");
                        } else if (placement.equals("Interstitial_Android")) {
                            loadUnityAd("fd6faa46-ba0e-46b8-b3db-a7f456ee0b01");
                        } else {
                            runOnUiThread(() -> Toast.makeText(MainActivity.this, "Unity Load Fail: " + message, Toast.LENGTH_LONG).show());
                        }
                    }
                });
            }

            public class AdBridge {
                @JavascriptInterface
                public void showTopBanner() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            if (bannerContainer == null) {
                                bannerContainer = new FrameLayout(MainActivity.this);
                                FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                                    ViewGroup.LayoutParams.WRAP_CONTENT,
                                    ViewGroup.LayoutParams.WRAP_CONTENT,
                                    Gravity.TOP | Gravity.CENTER_HORIZONTAL
                                );
                                startAppBanner = new Banner(MainActivity.this);
                                bannerContainer.addView(startAppBanner, params);
                                addContentView(bannerContainer, new ViewGroup.LayoutParams(
                                    ViewGroup.LayoutParams.MATCH_PARENT,
                                    ViewGroup.LayoutParams.WRAP_CONTENT
                                ));
                                startAppBanner.loadAd();
                            }
                            bannerContainer.setVisibility(View.VISIBLE);
                            startAppBanner.showBanner();
                        }
                    });
                }

                @JavascriptInterface
                public void hideTopBanner() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            if (bannerContainer != null) {
                                bannerContainer.setVisibility(View.GONE);
                            }
                        }
                    });
                }

                @JavascriptInterface
                public void showUnityAd() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            if (isUnityReady) {
                                UnityAds.show(MainActivity.this, activeUnityPlacement, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                    @Override public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                        triggerSaveInWeb();
                                    }
                                    @Override public void onUnityAdsShowStart(String placementId) {}
                                    @Override public void onUnityAdsShowClick(String placementId) {}
                                    @Override public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                        isUnityReady = false;
                                        loadUnityAd(activeUnityPlacement);
                                        triggerSaveInWeb();
                                    }
                                });
                            } else {
                                triggerSaveInWeb();
                            }
                        }
                    });
                }

                @JavascriptInterface
                public void saveVideoFile(String base64Data, String fileName) {
                    try {
                        String pureBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                        byte[] videoBytes = Base64.decode(pureBase64, Base64.DEFAULT);
                        File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        if (!downloadsDir.exists()) downloadsDir.mkdirs();
                        File videoFile = new File(downloadsDir, fileName);
                        FileOutputStream fos = new FileOutputStream(videoFile);
                        fos.write(videoBytes);
                        fos.close();
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "تم حفظ الفيديو بنجاح في Downloads ✅", Toast.LENGTH_LONG).show());
                    } catch (Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "خطأ في الحفظ: " + e.getMessage(), Toast.LENGTH_LONG).show());
                    }
                }

                private void triggerSaveInWeb() {
                    final WebView webView = (WebView) appView.getEngine().getView();
                    webView.post(new Runnable() {
                        @Override
                        public void run() {
                            webView.evaluateJavascript("window.executeVideoSave();", null);
