name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create and Build Project
      run: |
        cordova create cordova_project com.waildloussa.aivideow "AI Video W"
        cd cordova_project
        rm -rf www/*
        cp ../index.html www/
        cp ../script.js www/
        cp ../style.css www/
        cp ../config.xml .
        cordova platform add android
        
        IS_URL="https://is.com"
        ST_URL="https://startapp.com"
        printf "repositories {\n mavenCentral()\n google()\n maven { url '${ST_URL}' }\n maven { url '${IS_URL}' }\n}\ndependencies {\n implementation 'com.ironsource.sdk:mediationsdk:8.4.0'\n implementation 'com.ironsource.adapters:unityadsadapter:4.3.42'\n implementation 'com.unity3d.ads:unity-ads:4.12.2'\n implementation 'com.startapp:inapp-sdk:5.0.2'\n}\n" > platforms/android/app/build-extras.gradle

        cat << 'EOF' > platforms/android/app/src/main/java/com/waildloussa/aivideow/MainActivity.java
        package com.waildloussa.aivideow;
        import android.os.Bundle;
        import android.os.Environment;
        import android.util.Base64;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebView;
        import android.widget.FrameLayout;
        import android.widget.Toast;
        import java.io.File;
        import java.io.FileOutputStream;
        import org.apache.cordova.*;
        import com.startapp.sdk.ads.banner.Banner;
        import com.startapp.sdk.adsbase.StartAppAd;
        import com.startapp.sdk.adsbase.StartAppSDK;
        import com.ironsource.mediationsdk.IronSource;
        import com.ironsource.mediationsdk.adunit.adapter.utility.AdInfo;
        import com.ironsource.mediationsdk.logger.IronSourceError;
        import com.ironsource.mediationsdk.model.Placement;
        import com.ironsource.mediationsdk.sdk.LevelPlayRewardedVideoListener;

        public class MainActivity extends CordovaActivity {
            private Banner startAppBanner;
            private FrameLayout bannerContainer;
            private final String LEVELPLAY_APP_KEY = "2979d4965";

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                StartAppSDK.init(this, "210770048", false);
                StartAppSDK.setTestAdsEnabled(true);
                StartAppAd.disableSplash();

                IronSource.setLevelPlayRewardedVideoListener(new LevelPlayRewardedVideoListener() {
                    @Override public void onAdAvailable(AdInfo adInfo) {}
                    @Override public void onAdUnavailable() {}
                    @Override public void onAdOpened(AdInfo adInfo) {}
                    @Override public void onAdShowFailed(IronSourceError error, AdInfo adInfo) {
                        triggerSaveInWeb();
                    }
                    @Override public void onAdClicked(Placement placement, AdInfo adInfo) {}
                    @Override public void onAdRewarded(Placement placement, AdInfo adInfo) {}
                    @Override public void onAdClosed(AdInfo adInfo) {
                        triggerSaveInWeb();
                    }
                });

                IronSource.init(this, LEVELPLAY_APP_KEY);

                loadUrl(launchUrl);
                if (appView != null && appView.getEngine() != null) {
                    WebView webView = (WebView) appView.getEngine().getView();
                    webView.getSettings().setJavaScriptEnabled(true);
                    webView.addJavascriptInterface(new AdBridge(), "AndroidAds");
                }
            }

            @Override
            protected void onResume() {
                super.onResume();
                IronSource.onResume(this);
            }

            @Override
            protected void onPause() {
                super.onPause();
                IronSource.onPause(this);
            }

            private void triggerSaveInWeb() {
                final WebView webView = (WebView) appView.getEngine().getView();
                webView.post(() -> webView.evaluateJavascript("window.executeVideoSave();", null));
            }

            public class AdBridge {
                @JavascriptInterface
                public void showTopBanner() {
                    runOnUiThread(() -> {
                        if (bannerContainer == null) {
                            bannerContainer = new FrameLayout(MainActivity.this);
                            FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                            startAppBanner = new Banner(MainActivity.this);
                            bannerContainer.addView(startAppBanner, params);
                            addContentView(bannerContainer, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                            startAppBanner.loadAd();
                        }
                        bannerContainer.setVisibility(View.VISIBLE);
                        startAppBanner.showBanner();
                    });
                }

                @JavascriptInterface
                public void hideTopBanner() {
                    runOnUiThread(() -> { if (bannerContainer != null) bannerContainer.setVisibility(View.GONE); });
                }

                @JavascriptInterface
                public void showUnityAd() {
                    runOnUiThread(() -> {
                        if (IronSource.isRewardedVideoAvailable()) {
                            IronSource.showRewardedVideo();
                        } else {
                            Toast.makeText(MainActivity.this, "جاري تجهيز الإعلان، سيتم الحفظ...", Toast.LENGTH_SHORT).show();
                            triggerSaveInWeb();
                        }
                    });
                }

                @JavascriptInterface
                public void saveVideoFile(String base64Data, String fileName) {
                    try {
                        String pureBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                        byte[] videoBytes = Base64.decode(pureBase64, Base64.DEFAULT);
                        File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        if (!downloadsDir.exists()) downloadsDir.mkdirs();
                        File videoFile = new File(downloadsDir, fileName);
                        FileOutputStream fos = new FileOutputStream(videoFile);
                        fos.write(videoBytes);
                        fos.close();
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "تم حفظ الفيديو في Downloads ✅", Toast.LENGTH_LONG).show());
                    } catch (Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "خطأ في الحفظ: " + e.getMessage(), Toast.LENGTH_LONG).show());
                    }
                }
            }
        }
        EOF
        cordova build android

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: AI Video W v1.0.${{ github.run_number }}
        files: cordova_project/platforms/android/app/build/outputs/apk/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
